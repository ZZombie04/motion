<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="motion-template" content='{"about": "투명 이름표 + 모서리 로고 글자 — 편집 프로그램에 얹는 오버레이(--format mov --alpha)", "format": "wide", "duration": 6}'>
<title>{{TITLE}}</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="./_motion/motion.css">
<script src="./_motion/gsap.min.js"></script>
<script src="./_motion/icons.js"></script>
<script src="./_motion/motion.js"></script>
<style>
  /* 투명 오버레이(16:9, 6초) — 이름표(M.lowerThird) + 오른쪽 위 로고 글자. 편집 프로그램 위에 얹는다:
     motion render 파일.html --format mov --alpha
     배경·그레인·비네트를 넣지 않는다. 글자 뒤의 반투명 판이 어떤 화면 위에서도 읽히게 한다.
     문구는 data-var: name · title · brand. 색은 --vars "accent=mint", 밝은 판은 --vars "theme=white". */

  #ov { position: absolute; inset: 0; }                                   /* 무대 전체 — 이름표의 안전 여백이 한 번만 적용되게 */

  /* 이름표: 엔진 기본 모양 위에 반투명 판, 아래 가장자리에는 떠 있는 시간만큼 차오르는 실선 */
  .mo-lt { --plate: 0; }
  .mo-lt::before { content: ""; position: absolute; z-index: -1; pointer-events: none;
                   left: calc(var(--u) * -2.2); right: calc(var(--u) * -3.4); top: calc(var(--u) * -1.9); bottom: calc(var(--u) * -1.9); border-radius: var(--r-sm);
                   background: color-mix(in oklab, var(--bg) 74%, transparent);
                   box-shadow: inset 0 0 0 1px var(--line), inset 0 1px 0 rgba(255, 255, 255, calc(var(--edge) * 0.6)), 0 calc(var(--u) * 1.2) calc(var(--u) * 4) rgba(var(--shade), calc(var(--sh-a) * 0.6));
                   clip-path: inset(-30% calc((1 - var(--plate)) * 100%) -30% -2% round var(--r-sm)); }
  .mo-lt-name { font-size: calc(var(--u) * 4.6); padding: 0.06em 0.04em 0.2em; margin: -0.06em -0.04em -0.2em; }   /* 엔진 기본값(line-height 1.1 + overflow:hidden)은 g·y의 내려쓴 획을 자른다 */
  .mo-lt-title { font-size: calc(var(--u) * 2.5); }
  .lt-time { position: absolute; left: calc(var(--u) * 2.35); right: 0; bottom: calc(var(--u) * -0.95); height: 2px; border-radius: 2px;   /* 글자 단의 폭에 맞춘다 */
             background: rgba(var(--tint), 0.26); transform-origin: 0 50%; }

  /* 오른쪽 위 로고 글자(버그) */
  #bug { position: absolute; right: var(--safe-x); top: var(--safe-t); display: flex; align-items: center; gap: calc(var(--u) * 1.1);
         height: calc(var(--u) * 4.6); padding: 0 calc(var(--u) * 1.8) 0 calc(var(--u) * 0.8); border-radius: 99px;
         background: color-mix(in oklab, var(--bg) 70%, transparent); box-shadow: inset 0 0 0 1px var(--line); }
  #mark { display: flex; align-items: center; justify-content: center; width: calc(var(--u) * 3); height: calc(var(--u) * 3); border-radius: 50%;
          background: var(--accent); color: var(--on-accent); font-size: calc(var(--u) * 1.5); }
  #mark .mo-icon { width: 1em; height: 1em; margin-left: 0.12em; }
  #mark svg { fill: currentColor; }
  #brand { font-size: calc(var(--u) * 2.3); font-weight: 700; letter-spacing: -0.02em; line-height: 1; white-space: nowrap; }
</style>
</head>
<body>
<div id="stage" data-title="{{TITLE}}" data-width="{{WIDTH}}" data-height="{{HEIGHT}}" data-fps="{{FPS}}" data-duration="{{DURATION}}" data-theme="{{THEME}}" data-accent="{{ACCENT}}" data-overlay{{PLATFORM}}>
  <div id="ov"></div>

  <!-- 이름표 문구(화면에는 M.lowerThird가 그린다) -->
  <div hidden>
    <span id="srcName" data-var="name" data-label="이름">이서연</span>
    <span id="srcTitle" data-var="title" data-label="직함·소속">수석 디자이너 · 모션 스튜디오</span>
  </div>

  <div id="bug"><span id="mark"><i data-icon="play" data-stroke="2.4"></i></span><span id="brand" data-var="brand" data-label="모서리 로고 글자">모션 스튜디오</span></div>
</div>

<script>
Motion.compose((M) => {
  const { tl, u, D } = M;
  const IN = 0.25, OUT = Math.max(IN + 2.5, D - 1.1);          // 6초: 0.25초에 들어와 4.9초에 나간다(끝 0.6초는 비운다)

  // ── 이름표 ── 판이 닦이듯 열리고, 막대가 서고, 이름이 마스크 아래에서 솟는다
  M.lowerThird({ name: M.$('#srcName').textContent.trim(), title: M.$('#srcTitle').textContent.trim(), parent: '#ov', out: OUT }, IN + 0.1);   // 편집용 오버레이라 소리는 기본으로 끈다(sfx: true면 켜진다)
  const lt = M.$('.mo-lt');
  tl.fromTo(lt, { '--plate': 0 }, { '--plate': 1, duration: 0.6, ease: 'mo.inOut' }, IN);
  const timer = M.el('<i class="lt-time"></i>', lt);                       // 떠 있는 동안 아주 천천히 차오른다 — 정지한 프레임이 생기지 않게
  tl.fromTo(timer, { scaleX: 0 }, { scaleX: 1, duration: OUT - IN - 0.9, ease: 'none' }, IN + 0.9);
  tl.to(timer, { opacity: 0, duration: 0.25, ease: 'mo.in' }, OUT);
  tl.to(lt, { '--plate': 0, duration: 0.38, ease: 'mo.in' }, OUT + 0.06);                 // 막대와 함께 접힌다

  // ── 로고 글자 ── 이름표보다 조금 늦게, 더 조용히
  tl.from('#bug', { autoAlpha: 0, x: u * 2, duration: 0.7, ease: 'mo.out' }, IN + 0.35);
  M.reveal('#mark', { type: 'pop', duration: 0.55 }, IN + 0.45);
  tl.to('#bug', { autoAlpha: 0, x: u * 1.2, duration: 0.4, ease: 'mo.in' }, OUT + 0.05);
});
</script>
</body>
</html>
